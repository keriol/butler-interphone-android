name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(
            find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print | head -n 1
          )"

          test -n "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Stage versioned debug APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(gradle -q :app:printVersionName)"
          BUILD_DATE="$(date -u +%F)"
          VERSION_LABEL="${VERSION/.dev/-dev}"
          mkdir -p staged-apk
          cp             app/build/outputs/apk/debug/app-debug.apk             "staged-apk/Butler-Interphone-${VERSION_LABEL}-${BUILD_DATE}.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Butler-Interphone-${{ github.sha }}
          path: staged-apk/Butler-Interphone-*.apk
          if-no-files-found: error
          retention-days: 7
