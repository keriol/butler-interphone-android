name: Android Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(
            find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print | head -n 1
          )"

          test -n "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Require release signing secrets
        env:
          INTERPHONE_KEYSTORE_B64: ${{ secrets.INTERPHONE_KEYSTORE_B64 }}
          INTERPHONE_KEYSTORE_PASSWORD: ${{ secrets.INTERPHONE_KEYSTORE_PASSWORD }}
          INTERPHONE_KEY_ALIAS: ${{ secrets.INTERPHONE_KEY_ALIAS }}
          INTERPHONE_KEY_PASSWORD: ${{ secrets.INTERPHONE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$INTERPHONE_KEYSTORE_B64"
          test -n "$INTERPHONE_KEYSTORE_PASSWORD"
          test -n "$INTERPHONE_KEY_ALIAS"
          test -n "$INTERPHONE_KEY_PASSWORD"

      - name: Materialize release keystore
        env:
          INTERPHONE_KEYSTORE_B64: ${{ secrets.INTERPHONE_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/butler-interphone-release.jks"
          printf '%s' "$INTERPHONE_KEYSTORE_B64" | base64 --decode >"$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "INTERPHONE_KEYSTORE_PATH=$KEYSTORE_PATH" >>"$GITHUB_ENV"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build signed release APK
        env:
          INTERPHONE_KEYSTORE_PASSWORD: ${{ secrets.INTERPHONE_KEYSTORE_PASSWORD }}
          INTERPHONE_KEY_ALIAS: ${{ secrets.INTERPHONE_KEY_ALIAS }}
          INTERPHONE_KEY_PASSWORD: ${{ secrets.INTERPHONE_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Stage release artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(gradle -q :app:printVersionName)"
          BUILD_DATE="$(date -u +%F)"
          VERSION_LABEL="${VERSION/.dev/-dev}"
          mkdir -p release-artifact
          cp             app/build/outputs/apk/release/app-release.apk             "release-artifact/Butler-Interphone-${VERSION_LABEL}-${BUILD_DATE}.apk"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: Butler-Interphone-release-${{ github.sha }}
          path: release-artifact/Butler-Interphone-*.apk
          if-no-files-found: error
          retention-days: 14
